<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Калькулятор раскроя | Brutal RAL 3005</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', 'Segoe UI', 'Roboto Mono', monospace;
            padding: 32px 24px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Карточки – тёмно-серые, строгие */
        .card {
            background: #1e1e1e;
            border: 1px solid #2c2c2c;
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            transition: none;
        }

        .card-header {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 1.5rem;
            border-left: 6px solid #7a1f2d; /* RAL 3005 */
            padding-left: 1rem;
            color: #eaeaea;
            text-transform: uppercase;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .form-row label {
            font-weight: 500;
            min-width: 150px;
            color: #bbb;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        input, select, button {
            background: #111;
            border: 1px solid #333;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #eee;
            font-family: monospace;
            border-radius: 0px;
            transition: 0.1s linear;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #7a1f2d;
            background: #000;
        }

        button {
            background: #7a1f2d;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #5e1622;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #7a1f2d;
            color: #7a1f2d;
        }

        .btn-outline:hover {
            background: #7a1f2d20;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            font-family: monospace;
        }

        th, td {
            border: 1px solid #2a2a2a;
            padding: 8px 6px;
            text-align: center;
        }

        th {
            background: #151515;
            color: #ccc;
            font-weight: 600;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .stock-item {
            background: #121212;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 3px solid #7a1f2d;
        }

        .flex-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0;
        }

        .visualization {
            margin-top: 24px;
            background: #111;
            padding: 20px;
            border: 1px solid #2a2a2a;
        }

        .vis-slab {
            margin-bottom: 28px;
            border-bottom: 1px solid #2c2c2c;
            padding-bottom: 16px;
        }

        .vis-bar-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .vis-bar {
            display: flex;
            flex: 1;
            min-width: 200px;
            background: #2a2a2a;
            overflow: hidden;
        }

        .vis-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 2px black;
            white-space: nowrap;
            padding: 0 4px;
        }

        .vis-legend {
            margin-top: 16px;
            display: flex;
            gap: 24px;
            font-size: 12px;
            font-family: monospace;
        }

        .status-msg {
            background: #0f0f0f;
            padding: 12px;
            margin-top: 16px;
            border-left: 3px solid #7a1f2d;
            font-family: monospace;
        }

        h4 {
            color: #ccc;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* БЛОКИРОВКА ПАРОЛЕМ */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .password-box {
            background: #1a1a1a;
            border: 2px solid #7a1f2d;
            padding: 2rem;
            min-width: 320px;
            text-align: center;
        }
        .password-box input {
            width: 100%;
            margin: 20px 0;
            background: black;
            border-color: #7a1f2d;
            text-align: center;
            font-size: 1.2rem;
        }
        .error-msg {
            color: #bc6c25;
            font-family: monospace;
            margin-top: 10px;
        }
        .disabled-interaction {
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<!-- Блокировка паролем -->
<div id="passwordOverlay" class="password-overlay">
    <div class="password-box">
        <h2 style="color:#7a1f2d;">◼ ДОСТУП ОГРАНИЧЕН</h2>
        <p>Введите пароль для разблокировки</p>
        <input type="password" id="passwordInput" placeholder="Пароль" autofocus>
        <button id="unlockBtn">РАЗБЛОКИРОВАТЬ</button>
        <div id="passwordError" class="error-msg"></div>
    </div>
</div>

<div id="mainApp" style="display: none;">
<div class="container">
    <h1 style="color:#e0e0e0; font-weight: 300; letter-spacing: -1px; margin-bottom: 20px;">◼︎ ROUGH CUT — ПИЛОМАТЕРИАЛ</h1>

    <!-- Общие настройки -->
    <div class="card">
        <div class="card-header">⚙️ ПАРАМЕТРЫ РАСКРОЯ</div>
        <div class="grid-2col">
            <div>
                <div class="form-row"><label>Толщина пропила (мм):</label><input type="number" id="kerf" value="5" step="0.5"></div>
                <div class="form-row"><label>Единицы длины:</label><select id="units"><option value="mm">мм</option><option value="m">метры</option></select></div>
                <div class="form-row"><label>Цена материала (руб/м³):</label><input type="number" id="pricePerM3" value="15000" step="500"></div>
            </div>
            <div>
                <div class="form-row"><label>Режим запаса заготовок:</label>
                    <select id="stockModeGlobal">
                        <option value="unlimited">Неограниченный (один типоразмер)</option>
                        <option value="limited">Ограниченный список (разные сечения)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Блок ЗАГОТОВОК (динамический) -->
    <div class="card" id="stockCard">
        <div class="card-header" id="stockHeader">📦 ЗАГОТОВКИ</div>
        <div id="stockUiContainer"></div>
        <button type="button" id="addStockRowBtn" class="btn-outline" style="display: none;">+ Добавить типоразмер</button>
    </div>

    <!-- ДЕТАЛИ -->
    <div class="card">
        <div class="card-header">📋 ДЕТАЛИ ДЛЯ РАСКРОЯ</div>
        <div class="flex-btns">
            <button id="importPartsBtn">📂 ИМПОРТ (XLSX)</button>
            <button id="addPartRowBtn" class="btn-outline">+ ДЕТАЛЬ</button>
            <button id="clearPartsBtn" class="btn-outline">ОЧИСТИТЬ</button>
        </div>
        <div class="table-responsive">
            <table id="partsTable">
                <thead><tr><th>МАРКИРОВКА</th><th>ДЛИНА (мм)</th><th>КОЛ-ВО</th><th></th></tr></thead>
                <tbody id="partsTbody"></tbody>
            </table>
        </div>
    </div>

    <div class="flex-btns">
        <button id="calculateBtn" style="background:#7a1f2d; padding:12px 28px;">◼ РАССЧИТАТЬ РАСКРОЙ</button>
        <button id="exportExcelBtn" class="btn-outline">📎 ЭКСПОРТ EXCEL</button>
    </div>

    <!-- РЕЗУЛЬТАТЫ -->
    <div class="card" id="resultCard" style="display:none;">
        <div class="card-header">РЕЗУЛЬТАТ ОПТИМИЗАЦИИ</div>
        <div id="summaryStats" style="background:#121212; padding:16px; margin-bottom:20px;"></div>
        <div class="table-responsive">
            <table id="resultPlanTable">
                <thead><tr><th>№</th><th>Сечение</th><th>Длина (мм)</th><th>Вырезанные детали</th><th>Остаток (мм)</th><th>Использование %</th></tr></thead>
                <tbody id="resultTbody"></tbody>
            </table>
        </div>
        <div id="visualizationArea" class="visualization"></div>
        <div id="costInfo" style="background:#0c0c0c; padding:16px; margin-top:16px; border-left: 3px solid #7a1f2d;"></div>
        <div class="status-msg" id="wasteInfoMsg"></div>
    </div>
</div>
</div>

<script>
    // ------------------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ -------------------
    let unlimitedStockConfig = {
        length: 6000,
        sectionType: 'rect',
        thick: 50,
        width: 150,
        diameter: 100
    };
    let limitedStockItems = [];
    let currentStockMode = 'unlimited';

    const stockModeSelect = document.getElementById('stockModeGlobal');
    const stockUiContainer = document.getElementById('stockUiContainer');
    const addStockBtn = document.getElementById('addStockRowBtn');
    const stockHeader = document.getElementById('stockHeader');

    // ------------------- ОТРИСОВКА UI В ЗАВИСИМОСТИ ОТ РЕЖИМА -------------------
    function renderStockUI() {
        stockUiContainer.innerHTML = '';
        if (currentStockMode === 'unlimited') {
            stockHeader.innerText = '📦 НЕОГРАНИЧЕННЫЙ ЗАПАС (один типоразмер)';
            addStockBtn.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'stock-item';
            div.innerHTML = `
                <div class="form-row"><label>Длина заготовки (мм):</label><input type="number" id="unlimLength" value="${unlimitedStockConfig.length}" step="100"></div>
                <div class="form-row"><label>Тип сечения:</label>
                    <select id="unlimSectionType">
                        <option value="rect" ${unlimitedStockConfig.sectionType==='rect'?'selected':''}>Прямоугольное</option>
                        <option value="round" ${unlimitedStockConfig.sectionType==='round'?'selected':''}>Круглое</option>
                    </select>
                </div>
                <div id="unlimRectParams" style="${unlimitedStockConfig.sectionType==='rect'?'block':'none'}">
                    <div class="form-row"><label>Толщина (мм):</label><input type="number" id="unlimThick" value="${unlimitedStockConfig.thick}" step="1"></div>
                    <div class="form-row"><label>Ширина (мм):</label><input type="number" id="unlimWidth" value="${unlimitedStockConfig.width}" step="1"></div>
                </div>
                <div id="unlimRoundParams" style="${unlimitedStockConfig.sectionType==='round'?'block':'none'}">
                    <div class="form-row"><label>Диаметр (мм):</label><input type="number" id="unlimDiam" value="${unlimitedStockConfig.diameter}" step="1"></div>
                </div>
            `;
            stockUiContainer.appendChild(div);
            document.getElementById('unlimLength')?.addEventListener('change', (e) => unlimitedStockConfig.length = parseFloat(e.target.value) || 1000);
            const secSelect = document.getElementById('unlimSectionType');
            if(secSelect) secSelect.addEventListener('change', (e) => {
                unlimitedStockConfig.sectionType = e.target.value;
                renderStockUI();
            });
            const thickInp = document.getElementById('unlimThick');
            if(thickInp) thickInp.addEventListener('change', (e) => unlimitedStockConfig.thick = parseFloat(e.target.value) || 0);
            const widthInp = document.getElementById('unlimWidth');
            if(widthInp) widthInp.addEventListener('change', (e) => unlimitedStockConfig.width = parseFloat(e.target.value) || 0);
            const diamInp = document.getElementById('unlimDiam');
            if(diamInp) diamInp.addEventListener('change', (e) => unlimitedStockConfig.diameter = parseFloat(e.target.value) || 0);
        } 
        else {
            stockHeader.innerText = '📦 ЗАГОТОВКИ НА СКЛАДЕ (разные сечения)';
            addStockBtn.style.display = 'inline-block';
            if(limitedStockItems.length === 0) {
                limitedStockItems.push({ length: 6000, qty: 3, sectionType: 'rect', thick: 50, width: 150, diameter: 0 });
            }
            limitedStockItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'stock-item';
                div.innerHTML = `
                    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
                        <input type="number" placeholder="Длина мм" value="${item.length}" step="10" style="width:110px;" data-idx="${idx}" class="stock-len">
                        <input type="number" placeholder="Кол-во" value="${item.qty}" step="1" min="1" style="width:90px;" data-idx="${idx}" class="stock-qty">
                        <select data-idx="${idx}" class="stock-section">
                            <option value="rect" ${item.sectionType==='rect'?'selected':''}>Прямоугольное</option>
                            <option value="round" ${item.sectionType==='round'?'selected':''}>Круглое</option>
                        </select>
                        <span id="rectParams-${idx}" style="display:${item.sectionType==='rect'?'inline-flex':'none'}; gap:6px;">
                            <input type="number" placeholder="Толщ" value="${item.thick}" step="1" style="width:80px;" data-idx="${idx}" class="stock-thick">
                            <input type="number" placeholder="Шир" value="${item.width}" step="1" style="width:80px;" data-idx="${idx}" class="stock-width">
                        </span>
                        <span id="roundParams-${idx}" style="display:${item.sectionType==='round'?'inline-flex':'none'}; gap:6px;">
                            <input type="number" placeholder="Диам" value="${item.diameter}" step="1" style="width:100px;" data-idx="${idx}" class="stock-diam">
                        </span>
                        <button class="delStockBtn" data-idx="${idx}" style="background:#3a1c1f;">Удалить</button>
                    </div>
                `;
                stockUiContainer.appendChild(div);
            });
            attachLimitedEvents();
        }
    }

    function attachLimitedEvents() {
        document.querySelectorAll('.stock-len').forEach(inp => inp.addEventListener('change', (e) => { let i = parseInt(e.target.dataset.idx); if(!isNaN(i)) limitedStockItems[i].length = parseFloat(e.target.value) || 0; }));
        document.querySelectorAll('.stock-qty').forEach(inp => inp.addEventListener('change', (e) => { let i = parseInt(e.target.dataset.idx); if(!isNaN(i)) limitedStockItems[i].qty = Math.max(1, parseInt(e.target.value) || 1); }));
        document.querySelectorAll('.stock-section').forEach(sel => sel.addEventListener('change', (e) => { let i = parseInt(e.target.dataset.idx); limitedStockItems[i].sectionType = e.target.value; renderStockUI(); }));
        document.querySelectorAll('.stock-thick').forEach(inp => inp.addEventListener('change', (e) => { let i = parseInt(e.target.dataset.idx); limitedStockItems[i].thick = parseFloat(e.target.value) || 0; }));
        document.querySelectorAll('.stock-width').forEach(inp => inp.addEventListener('change', (e) => { let i = parseInt(e.target.dataset.idx); limitedStockItems[i].width = parseFloat(e.target.value) || 0; }));
        document.querySelectorAll('.stock-diam').forEach(inp => inp.addEventListener('change', (e) => { let i = parseInt(e.target.dataset.idx); limitedStockItems[i].diameter = parseFloat(e.target.value) || 0; }));
        document.querySelectorAll('.delStockBtn').forEach(btn => btn.addEventListener('click', (e) => { let i = parseInt(btn.dataset.idx); limitedStockItems.splice(i,1); renderStockUI(); }));
    }

    function generateSlabsList() {
        let slabs = [];
        let id = 0;
        if(currentStockMode === 'unlimited') {
            const len = unlimitedStockConfig.length;
            const section = {
                type: unlimitedStockConfig.sectionType,
                thick: unlimitedStockConfig.thick,
                width: unlimitedStockConfig.width,
                diameter: unlimitedStockConfig.diameter
            };
            for(let i=0;i<500;i++) slabs.push({ id: id++, originalLength: len, currentLength: len, section: { ...section }, assignedParts: [] });
        } else {
            for(let st of limitedStockItems) {
                let len = st.length;
                let qty = Math.max(1, st.qty);
                let section = { type: st.sectionType, thick: st.thick, width: st.width, diameter: st.diameter };
                for(let i=0;i<qty;i++) slabs.push({ id: id++, originalLength: len, currentLength: len, section: { ...section }, assignedParts: [] });
            }
        }
        return slabs;
    }

    function getPartsFromTable() {
        const rows = document.querySelectorAll('#partsTbody tr');
        let parts = [];
        for(let row of rows) {
            let inputs = row.querySelectorAll('input');
            if(inputs.length >= 3) {
                let name = inputs[0].value.trim() || "Деталь";
                let length = parseFloat(inputs[1].value);
                let qty = parseInt(inputs[2].value);
                if(isNaN(length) || length <= 0) continue;
                if(isNaN(qty) || qty <= 0) continue;
                for(let i=0;i<qty;i++) parts.push({ name, length });
            }
        }
        return parts;
    }

    function getVolume(section, lengthMM) {
        let areaM2 = 0;
        if(section.type === 'rect') {
            let thickM = (section.thick || 0) / 1000;
            let widthM = (section.width || 0) / 1000;
            areaM2 = thickM * widthM;
        } else {
            let diamM = (section.diameter || 0) / 1000;
            areaM2 = Math.PI * (diamM/2) * (diamM/2);
        }
        return areaM2 * (lengthMM / 1000);
    }

    function optimizeCuts(partsList, slabsList, kerf) {
        let parts = partsList.map(p => ({ name: p.name, length: p.length }));
        parts.sort((a,b) => b.length - a.length);
        let available = slabsList.map(s => ({ ...s, currentLength: s.currentLength, assignedParts: [] }));
        let failed = false;
        for(let part of parts) {
            let bestIdx = -1, bestWaste = Infinity;
            for(let i=0;i<available.length;i++) {
                let need = part.length + kerf;
                if(available[i].currentLength >= need) {
                    let waste = available[i].currentLength - need;
                    if(waste < bestWaste) { bestWaste = waste; bestIdx = i; }
                }
            }
            if(bestIdx === -1) { failed = true; break; }
            let target = available[bestIdx];
            target.assignedParts.push({ name: part.name, length: part.length });
            target.currentLength -= (part.length + kerf);
            if(target.currentLength < 0) target.currentLength = 0;
        }
        if(failed) return { success: false, plan: [] };
        let plan = [];
        for(let slab of available) {
            if(slab.assignedParts.length > 0 || slab.currentLength < slab.originalLength) {
                plan.push({
                    id: slab.id,
                    originalLength: slab.originalLength,
                    leftover: slab.currentLength,
                    parts: slab.assignedParts,
                    section: slab.section
                });
            }
        }
        return { success: true, plan: plan };
    }

    function renderVisualization(plan, kerf) {
        const visDiv = document.getElementById('visualizationArea');
        visDiv.innerHTML = '<h4>◼ СХЕМА РАСКРОЯ (высота пропорциональна √площади сечения)</h4>';
        if(!plan.length) { visDiv.innerHTML += '<p>Нет данных</p>'; return; }
        let maxArea = 0;
        for(let p of plan) {
            let volPerM = getVolume(p.section, 1000);
            maxArea = Math.max(maxArea, volPerM * 1000);
        }
        if(maxArea < 0.001) maxArea = 0.01;
        for(let i=0;i<plan.length;i++) {
            const p = plan[i];
            const totalLen = p.originalLength;
            const area = getVolume(p.section, 1000) * 1000;
            let barHeight = Math.min(70, Math.max(22, 22 + (area / maxArea) * 48));
            const segments = [];
            for(let part of p.parts) {
                segments.push({ type: 'part', name: part.name, length: part.length, color: '#7a1f2d' });
            }
            if(p.leftover > 0) segments.push({ type: 'waste', name: 'Отход', length: p.leftover, color: '#3a3a3a' });
            const visDivItem = document.createElement('div');
            visDivItem.className = 'vis-slab';
            visDivItem.innerHTML = `<strong>ЗАГОТОВКА #${i+1}</strong> (дл. ${totalLen} мм, сеч. ${p.section.type==='rect'? `${p.section.thick}x${p.section.width}` : `⌀${p.section.diameter}`})`;
            const barContainer = document.createElement('div');
            barContainer.className = 'vis-bar-container';
            const bar = document.createElement('div');
            bar.className = 'vis-bar';
            bar.style.height = `${barHeight}px`;
            for(let seg of segments) {
                let percent = (seg.length / totalLen) * 100;
                let segDiv = document.createElement('div');
                segDiv.className = 'vis-segment';
                segDiv.style.width = `${percent}%`;
                segDiv.style.backgroundColor = seg.color;
                segDiv.title = `${seg.name} ${seg.length} мм`;
                segDiv.innerText = seg.length < 120 ? '' : `${seg.name} ${seg.length}`;
                bar.appendChild(segDiv);
            }
            barContainer.appendChild(bar);
            visDivItem.appendChild(barContainer);
            visDiv.appendChild(visDivItem);
        }
        const legend = document.createElement('div');
        legend.className = 'vis-legend';
        legend.innerHTML = '<span style="background:#7a1f2d; padding:4px 8px;">ДЕТАЛЬ</span> <span style="background:#3a3a3a; padding:4px 8px;">ОТХОД</span>';
        visDiv.appendChild(legend);
    }

    function runCalculation() {
        let parts = getPartsFromTable();
        if(parts.length === 0) { alert("Нет деталей для раскроя!"); return; }
        let slabs = generateSlabsList();
        if(slabs.length === 0) { alert("Нет доступных заготовок."); return; }
        let kerf = parseFloat(document.getElementById('kerf').value) || 0;
        let price = parseFloat(document.getElementById('pricePerM3').value) || 0;

        const result = optimizeCuts(parts, slabs, kerf);
        if(!result.success) {
            alert("Ошибка: недостаточно заготовок или слишком большой пропил. Увеличьте количество или длину.");
            return;
        }
        const plan = result.plan;
        if(plan.length === 0) {
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('summaryStats').innerHTML = '<p>Нет использованных заготовок</p>';
            return;
        }
        let totalVol = 0, totalWasteVol = 0, totalParts = 0, totalOrigLen = 0, totalWasteLen = 0;
        for(let p of plan) {
            let volUsed = getVolume(p.section, p.originalLength);
            let volWaste = getVolume(p.section, p.leftover);
            totalVol += volUsed;
            totalWasteVol += volWaste;
            totalParts += p.parts.length;
            totalOrigLen += p.originalLength;
            totalWasteLen += p.leftover;
        }
        const efficiency = totalOrigLen > 0 ? ((totalOrigLen - totalWasteLen)/totalOrigLen*100) : 0;
        const costMat = totalVol * price;
        const wasteCost = totalWasteVol * price;
        document.getElementById('summaryStats').innerHTML = `
            <div style="display:flex; flex-wrap:wrap; gap:20px;">
                <div><strong>📦 Заготовок использовано:</strong> ${plan.length} шт.</div>
                <div><strong>🔨 Деталей получено:</strong> ${totalParts} шт.</div>
                <div><strong>📐 Объём материала:</strong> ${totalVol.toFixed(4)} м³</div>
                <div><strong>🗑 Объём отходов:</strong> ${totalWasteVol.toFixed(4)} м³</div>
                <div><strong>⚡ Эффективность:</strong> ${efficiency.toFixed(1)}%</div>
            </div>
        `;
        const tbody = document.getElementById('resultTbody');
        tbody.innerHTML = '';
        for(let i=0;i<plan.length;i++) {
            const p = plan[i];
            let secStr = p.section.type==='rect' ? `${p.section.thick}x${p.section.width}` : `⌀${p.section.diameter}`;
            let partsStr = p.parts.map(pr=>`${pr.name}(${pr.length})`).join(', ');
            let usage = ((p.originalLength - p.leftover)/p.originalLength*100).toFixed(1);
            let row = tbody.insertRow();
            row.insertCell(0).innerText = i+1;
            row.insertCell(1).innerText = secStr;
            row.insertCell(2).innerText = p.originalLength;
            row.insertCell(3).innerText = partsStr || '—';
            row.insertCell(4).innerText = p.leftover;
            row.insertCell(5).innerText = `${usage}%`;
        }
        renderVisualization(plan, kerf);
        document.getElementById('costInfo').innerHTML = `
            <strong>💰 СТОИМОСТЬ</strong><br>
            Цена за м³: ${price} руб.<br>
            Израсходовано материала: ${totalVol.toFixed(4)} м³ → ${costMat.toFixed(2)} руб.<br>
            Отходы: ${totalWasteVol.toFixed(4)} м³ → ${wasteCost.toFixed(2)} руб.<br>
            <span style="background:#7a1f2d30; padding:4px;">Полезная стоимость: ${(costMat - wasteCost).toFixed(2)} руб.</span>
        `;
        document.getElementById('wasteInfoMsg').innerHTML = `♻️ Отходы длиной ${totalWasteLen} мм повторно использованы в алгоритме.`;
        document.getElementById('resultCard').style.display = 'block';
        window.lastPlan = plan;
        window.lastStats = { totalBlanks: plan.length, totalParts, totalVolume: totalVol, wasteVolume: totalWasteVol, efficiency, totalCost: costMat };
    }

    function exportExcel() {
        if(!window.lastPlan || window.lastPlan.length===0) { alert("Нет результатов расчёта"); return; }
        const plan = window.lastPlan;
        const rows = [];
        for(let i=0;i<plan.length;i++) {
            const p = plan[i];
            rows.push({
                "№": i+1,
                "Сечение": p.section.type==='rect'? `${p.section.thick}x${p.section.width}` : `⌀${p.section.diameter}`,
                "Длина мм": p.originalLength,
                "Детали": p.parts.map(pr=>`${pr.name}(${pr.length})`).join("; "),
                "Остаток мм": p.leftover,
                "Использование %": ((p.originalLength-p.leftover)/p.originalLength*100).toFixed(1)
            });
        }
        rows.push({ "№": "ИТОГО", "Сечение": "", "Длина мм": `Заготовок: ${window.lastStats.totalBlanks}`, "Детали": `Деталей: ${window.lastStats.totalParts}`, "Остаток мм": `Объём: ${window.lastStats.totalVolume.toFixed(4)} м³`, "Использование %": `Эфф: ${window.lastStats.efficiency.toFixed(1)}%` });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Раскрой");
        XLSX.writeFile(wb, `rough_cut_${Date.now()}.xlsx`);
    }

    function importParts(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const wb = XLSX.read(e.target.result, {type: 'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
            if(!rows || rows.length<2) return;
            const tbody = document.getElementById('partsTbody');
            tbody.innerHTML = '';
            for(let i=1;i<rows.length;i++) {
                let name = rows[i][0] ? rows[i][0].toString().trim() : `Деталь${i}`;
                let length = parseFloat(rows[i][1]);
                let qty = parseInt(rows[i][2]);
                if(isNaN(length) || length<=0) continue;
                if(isNaN(qty) || qty<=0) continue;
                addPartRow(name, length, qty);
            }
            alert("Импорт завершён");
        };
        reader.readAsArrayBuffer(file);
    }

    function addPartRow(name, len, qty) {
        const tbody = document.getElementById('partsTbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input type="text" value="${escapeHtml(name)}"></td><td><input type="number" value="${len}" step="10"></td><td><input type="number" value="${qty}" step="1"></td><td><button class="delPartRowBtn btn-outline">✖</button></td>`;
        tbody.appendChild(tr);
        tr.querySelector('.delPartRowBtn').addEventListener('click', () => tr.remove());
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, function(c){if(c==='&')return '&amp;';if(c==='<')return '&lt;';if(c==='>')return '&gt;';return c;}); }

    // ---------- ЗАЩИТА ПАРОЛЕМ ----------
    const overlay = document.getElementById('passwordOverlay');
    const mainApp = document.getElementById('mainApp');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const errorDiv = document.getElementById('passwordError');

    function unlockApp() {
        if (passwordInput.value === "rfnhecz") {
            overlay.style.display = 'none';
            mainApp.style.display = 'block';
        } else {
            errorDiv.innerText = "Неверный пароль. Доступ запрещён.";
            passwordInput.value = "";
            passwordInput.focus();
        }
    }

    unlockBtn.addEventListener('click', unlockApp);
    passwordInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') unlockApp(); });

    // Инициализация остальных событий (после разблокировки они будут активны, но события вешаем сразу)
    stockModeSelect.addEventListener('change', (e) => { currentStockMode = e.target.value; renderStockUI(); });
    document.getElementById('addStockRowBtn')?.addEventListener('click', () => { limitedStockItems.push({ length: 4000, qty: 2, sectionType: 'rect', thick: 40, width: 100, diameter: 0 }); renderStockUI(); });
    document.getElementById('addPartRowBtn').addEventListener('click', () => addPartRow('Новая', 700, 2));
    document.getElementById('clearPartsBtn').addEventListener('click', () => { document.getElementById('partsTbody').innerHTML = ''; });
    document.getElementById('calculateBtn').addEventListener('click', runCalculation);
    document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
    document.getElementById('importPartsBtn').addEventListener('click', () => { let inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls'; inp.onchange=e=>{if(e.target.files[0]) importParts(e.target.files[0]);}; inp.click(); });

    // стартовые демо-детали
    addPartRow('Балка L=1200', 1200, 3);
    addPartRow('Брусок 800', 800, 4);
    addPartRow('Рейка 450', 450, 6);
    currentStockMode = 'unlimited';
    renderStockUI();
</script>
</body>
</html>
